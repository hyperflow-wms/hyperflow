# Builds the engine image on every change and publishes it when a release is
# published: a release created without being saved as a draft, or a draft
# release when it is published later. A release pushes the image as its tag
# and as :latest. A pre-release pushes only its own tag, such as
# :v1.11.2-rc.1, and does not move :latest; publishing a pre-release is how a
# test image of master gets onto Docker Hub. Publishing happens here and
# nowhere else: a local `make push` tags the image from whatever
# `git describe` returns on that machine, which has already put a mis-tagged
# image on Docker Hub. The deploy job passes the release's tag to `make push`
# as RELEASE_TAG, so the image is tagged with exactly that tag and reports its
# version, even when another tag sits on the same commit, and the release's
# pre-release flag as PRERELEASE, which decides whether :latest is pushed.

name: CI

# Controls when the workflow will run
on:
  # Triggers the workflow on push or pull request events but only for the master branch
  push:
    branches: [ master ]
    tags: [ "v*.*.*" ]
  pull_request:
    branches: [ master ]
  release:
    types: ["published"]
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:
    inputs: {}

jobs:
  test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      # No install step: tests/connector.js reaches only wflib/connector.js and
      # common/{taskLabel,consoleLogger}.js, and tests/k8sJobSubmit.js adds
      # wflib/jobResult.js, common/jobMessage.js and
      # functions/kubernetes/{k8sJobSubmit,k8sAdmissionController,k8sJobCreate,jobSynchronization}.js.
      # k8sJobSubmit.js requires @kubernetes/client-node and js-yaml, and
      # k8sAdmissionController.js requires @kubernetes/client-node; the test
      # replaces exactly those with stubs, so a dependency required by any
      # other file fails it. tests/version.js needs only git, make, npm, sh and grep.
      # tests/functions.js is deliberately not run: it asserts synchronously on
      # an asynchronous notification and has failed since before this workflow.
      - name: Connector regression tests
        run: node tests/connector.js
      - name: Kubernetes Job creation tests
        run: node tests/k8sJobSubmit.js
      - name: Version build-argument tests
        run: node tests/version.js

  build:
    needs: [ test ]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          # Need tags for Makefile logic to work
          fetch-depth: 0
      - name: Build the Docker images
        run: make image

  deploy:
    needs: [ build ]
    runs-on: ubuntu-22.04
    if: github.event_name == 'release' && github.event.action == 'published'
    steps:
      - uses: actions/checkout@v4
        with:
          # Need tags for Makefile logic to work
          fetch-depth: 0
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      # On a release event GITHUB_REF_NAME is the release's tag name, and
      # PRERELEASE is "true" for a pre-release and "false" for any other
      # release. make push pushes :latest for "false" (or when PRERELEASE is
      # unset, as in a local run), and refuses any value other than "true" or
      # "false" before it builds anything.
      - name: Build and Push Docker Images
        env:
          PRERELEASE: ${{ github.event.release.prerelease }}
        run: make push RELEASE_TAG="$GITHUB_REF_NAME" PRERELEASE="$PRERELEASE"
